<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculoINC.css">
</head>
<body>
    <h1> Cadastro de IMC</h1>

    <label>Digite o seu nome:</label>
    <input type="text" id="nome">

    <br><br>

    <label>Digite peso (em kg):</label>
    <input type="number" id="peso" step="0.1">

    <br><br>

    <label>Digite a altura:</label>
    <input type="number" id="altura" step="0.01">

    <br><br>

    <button type="button" onclcik="adicionarPessoa()">
        Cadastrar
    </button>


    <h2> Pessoas cadastradas:</h2>
    <table>
        <tr>
            <th>Nome </th>
            <th>Altura </th>
            <th>Peso </th>
            <th>IMC</th>
        </tr>

        <tbody id="tabela"></tbody>
    </table>
    <script src="calculoIMC.js"></script>

    
    


</body>
</html>
